plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def quickjsDir = System.getenv("QUICKJS_DIR") ?: "${rootDir}/../.local/tools/quickjs-2026-06-04"

android {
    namespace "lx.compat"
    compileSdk 34

    buildFeatures {
        aidl true
    }

    defaultConfig {
        applicationId "cn.toside.music.mobile.nativegate.test"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.0.1-test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "x86_64", "x86"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none", "-DQUICKJS_DIR=${quickjsDir}"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main {
            kotlin.srcDirs += ["${rootDir}/../src/main/kotlin"]
            assets.srcDirs += ["${rootDir}/../fixtures/baseline"]
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}
